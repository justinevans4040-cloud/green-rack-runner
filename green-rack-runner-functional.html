  <title>Green Rack Runner</title>
  <style>
    :root{--bg:#04100b;--panel:#081a12;--panel2:#0d2418;--panel3:#123321;--line:rgba(180,255,211,.16);--line2:rgba(82,255,155,.28);--text:#effff5;--muted:#a3c9b2;--soft:#6d8c77;--green:#35ff8a;--lime:#b7ff52;--amber:#ffd166;--red:#ff5a6a;--blue:#70d7ff;--shadow:0 24px 70px rgba(0,0,0,.45);--r:18px}

    input,select,textarea{width:100%;border:1px solid var(--line);border-radius:12px;background:#03100a;color:var(--text);padding:10px 11px;outline:none}textarea{min-height:90px;resize:vertical}label{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;font-weight:900;letter-spacing:.08em;margin-bottom:6px}
    .shell{display:grid;grid-template-columns:260px 1fr;min-height:100vh}.side{border-right:1px solid var(--line);background:rgba(4,16,11,.84);padding:18px;position:sticky;top:0;height:100vh}.logo{display:flex;gap:12px;align-items:center;margin-bottom:22px}.mark{width:48px;height:48px;border-radius:15px;background:linear-gradient(135deg,var(--green),var(--lime));color:#031006;display:grid;place-items:center;font-weight:1000}.logo b{display:block;letter-spacing:.08em}.logo small{color:var(--muted);font-weight:800}.nav{display:grid;gap:9px}.nav button{display:flex;justify-content:space-between;align-items:center;text-align:left}.nav button.active{background:linear-gradient(135deg,rgba(53,255,138,.25),rgba(183,255,82,.14));border-color:var(--line2)}.system{margin-top:20px;border:1px solid var(--line);border-radius:var(--r);padding:12px;background:rgba(255,255,255,.035);color:var(--muted);font-size:13px;line-height:1.45}
    .main{padding:18px 20px 100px}.top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:14px}.eyebrow{color:var(--green);font-size:12px;font-weight:1000;letter-spacing:.12em;text-transform:uppercase}.top h1{font-size:34px;margin:3px 0}.sub{color:var(--muted)}.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
    .stats{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin:12px 0 16px}.stat{border:1px solid var(--line);border-radius:16px;padding:12px;background:rgba(255,255,255,.035);box-shadow:var(--shadow)}.stat span{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;font-weight:900}.stat b{font-size:24px}.grid{display:grid;gap:14px}.grid.two{grid-template-columns:1fr 1fr}.grid.three{grid-template-columns:repeat(3,1fr)}.card{border:1px solid var(--line);border-radius:var(--r);padding:14px;background:linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.025));box-shadow:var(--shadow)}.card h2,.card h3{margin:0 0 10px}.head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin-bottom:10px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.hr{height:1px;background:var(--line);margin:12px 0}.badge{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:999px;padding:5px 8px;color:var(--muted);font-size:11px;font-weight:950;text-transform:uppercase}.badge.good{color:var(--green);border-color:rgba(53,255,138,.42)}.badge.warn{color:var(--amber);border-color:rgba(255,209,102,.42)}.badge.danger{color:var(--red);border-color:rgba(255,90,106,.45)}.badge.blue{color:var(--blue);border-color:rgba(112,215,255,.45)}
    .wall{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(320px,.8fr);gap:14px}.tables{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:12px}.table{border:1px solid rgba(53,255,138,.24);border-radius:18px;padding:12px;background:linear-gradient(150deg,rgba(53,255,138,.11),rgba(255,255,255,.025));position:relative;overflow:hidden}.table.done{opacity:.72}.table.disputed{border-color:rgba(255,90,106,.55)}.tableNo{position:absolute;right:12px;top:4px;font-size:56px;font-weight:1000;color:rgba(183,255,82,.12)}.playerLine{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;border:1px solid var(--line);border-radius:14px;padding:10px;margin:8px 0;background:rgba(0,0,0,.16)}.pname{font-size:18px;font-weight:950}.psub{font-size:12px;color:var(--muted);margin-top:2px}.scoreCtl{display:flex;gap:5px;align-items:center}.score{min-width:36px;text-align:center;font-size:24px;font-weight:1000}.list{display:grid;gap:8px}.item{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:14px;padding:10px;background:rgba(255,255,255,.03)}.item.simple{grid-template-columns:1fr auto}.cardHeader{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin-bottom:10px}.cardHeader p{margin:3px 0 0;color:var(--muted)}.playerRow,.matchRow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:14px;padding:10px;margin:8px 0;background:rgba(255,255,255,.03)}.nameLine{font-weight:950}.subLine{font-size:12px;color:var(--muted);margin-top:2px}.notice{border:1px solid var(--line);border-radius:14px;padding:12px;background:rgba(255,255,255,.035);color:var(--muted)}.bracketCard{overflow:hidden}.bracketBoard{display:grid;gap:18px}.bracketDivision{border:1px solid var(--line);border-radius:16px;background:rgba(0,0,0,.14);padding:12px;overflow:hidden}.bracketDivisionTitle{display:flex;justify-cont d;left:50%;bottom:10px;transform:translateX(-50%);z-index:1000;width:min(1120px,calc(100% - 16px));display:grid;grid-template-columns:repeat(10,1fr);gap:6px;padding:7px;border:1px solid var(--line2);border-radius:18px;background:rgba(3,12,8,.94);box-shadow:0 16px 60px rgba(0,0,0,.55)}.directorBar button{min-height:44px;padding:8px 6px;font-size:11px;border-radius:12px}.modalShade{position:fixed;inset:0;z-index:2000;background:rgba(0,0,0,.76);display:flex;align-items:flex-end;justify-content:center;padding:12px}.modal{width:min(920px,100%);max-height:90vh;overflow:auto;border:1px solid var(--line2);border-radius:20px;background:#04100b;box-shadow:0 24px 90px rgba(0,0,0,.7);padding:14px}.tv{font-size:1.12rem}.tv .shell{display:block}.tv .side,.tv .actions .hideTv,.tv .directorBar{display:none}.tv .main{padding:22px}.tv .top h1{font-size:52px}.tv .wall{grid-template-columns:1fr}.tv .tables{grid-template-columns:repeat(auto-fit,minmax(380px,1fr))}.tv .table{min-height:250px}.tv .bracketRounds{grid-auto-columns:minmax(360px,1fr)}.fileInput{display:none}
    @media(max-width:900px){.shell{grid-template-columns:1fr}.side{height:auto;position:static;border-right:0;border-bottom:1px solid var(--line)}.nav{grid-template-columns:repeat(3,1fr)}.wall,.grid.two,.grid.three{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}.top{display:block}.actions{justify-content:flex-start}.moneyLine{grid-template-columns:1fr}.item{grid-template-columns:1fr}.main{padding:12px 12px 150px}.directorBar{grid-template-columns:repeat(3,1fr);bottom:6px}}

  <style>
    .status-strip{display:flex;align-items:center;gap:28px;padding:13px 17px;border:1px solid #1b2b23;background:#0b110e;border-radius:12px;color:#72847b;font-size:12px;overflow-x:auto}.status-strip span:first-child{color:#79ff91;font-weight:800}.status-strip i,.live-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#5cff79;box-shadow:0 0 12px #5cff79;margin-right:7px}.status-strip b{color:#fff}.bracket-stage{margin-top:16px;border:1px solid #203128;border-radius:16px;background:linear-gradient(140deg,#192f2352,#060c09f2);min-height:650px;padding:25px;position:relative;overflow:hidden}.bracket-stage:before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(108,255,139,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(108,255,139,.025) 1px,transparent 1px);background-size:30px 30px;pointer-events:none}.bracket-grid{display:grid;grid-template-columns:minmax(360px,1fr) minmax(320px,.8fr) minmax(300px,.7fr);gap:70px;position:relative;max-width:1320px}.bracket-grid h3{font-size:11px;letter-spacing:.16em;color:#58e97a;margin:0 0 12px;text-transform:uppercase}.match{border:1px solid #2c4036;background:#0d1812eb;border-radius:10px;margin:12px 0 20px;max-width:410px;overflow:hidden;position:relative}.match:after{content:"";position:absolute;right:-71px;top:50%;width:70px;border-top:2px solid rgba(104,245,132,.32)}.bracket-grid>div:last-child .match:after{display:none}.match-label{height:26px;padding:7px 12px;color:#63ed7e;font-size:9px;letter-spacing:.12em;text-transform:uppercase}.match-player{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;padding:10px 13px;border-top:1px solid #203028;font-size:14px}.match-player b{color:#6df289}.match-player.muted{color:#829088}.match-player.win{background:#102717;color:#eaffef}.match.live{border-color:#45ec79;box-shadow:0 0 24px #41ff7126}.next-round{padding-top:72px}.elimination-side{padding-left:18px;border-left:1px solid #173124}.score-dock{position:absolute;left:24px;right:24px;bottom:22px;border:1px solid #2b5138;background:#06100af0;backdrop-filter:blur(18px);border-radius:14px;padding:15px 17px;display:flex;justify-content:space-between;align-items:center;gap:14px}.score-dock>div:first-child{display:grid}.score-dock span{color:#68f083;font-size:10px;letter-spacing:.13em;font-weight:800}.score-dock b{font:600 18px Barlow Condensed,Inter,sans-serif;margin-top:5px}.score-dock em{font-style:normal;color:#7cff8b;font-size:24px;margin:0 12px}.score-actions{display:flex;gap:8px;flex-wrap:wrap}.score-actions button{display:flex;align-items:center;gap:7px;padding:10px 12px}.score-actions .primary{background:#8aff74;color:#061108;border-color:#a6ff98}.tv .bracket-stage{min-height:calc(100vh - 210px)}@media(max-width:1100px){.bracket-grid{grid-template-columns:1fr;gap:12px}.next-round{padding-top:0}.score-dock{position:static;margin-top:18px}.match:after{display:none}}

<body>
  <div id="app"></div>
  <input id="backupFile" class="fileInput" type="file" accept=".json,application/json">
  <script>
    const KEY = "green_rack_runner_functional_v2";
    const PLAYER_DB_KEY = "green_rack_runner_player_database_v1";
    const SETUP_PRESETS_KEY = "green_rack_runner_setup_presets_v1";
    const NOW = () => new Date().toISOString();
    const MAX_HISTORY = 80;
    const DEFAULT = {
      version: 2, tab: "bracket", tv: false, phase: "setup",
      tournament: { name: "", venue: "", director: "", date: "", format: "", pairingMode: "", seedMode: "", ratingEngine: "", ratingBase: "", ratingK: "", tables: "", raceTo: "", raceToFinal: "", breakRule: "", startedAt: "", finishedAt: "" },
      bank: { buyIn: "", sidePot: "", added: "", paidPlaces: "", roundTo: "", pcts: ["","","","","","","",""] },
      players: [], matches: [], rounds: [], eliminationOrder: [], log: [], history: [], nextPlayerId: 1, nextMatchId: 1
    };
    let S = loadState();
    let DB = loadPlayerDb();
    let PRESETS = loadSetupPresets();
    const $ = id => document.getElementById(id);
    const esc = v => String(v ?? "").replace(/[&<>"']/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));
    const clean = v => String(v || "").trim().replace(/\s+/g, " ");
    const money = n => "$" + Number(n || 0).toLocaleString(undefined, {maximumFractionDigits:0});
    const hasValue = v => v !== "" && v !== null && v !== undefined;
    const num = v => hasValue(v) ? Number(v) : 0;
    const shown = v => hasValue(v) ? esc(v) : "-";
    const fallbackRatingBase = () => Number(S.tournament.ratingBase) || 500;
    const fallbackRatingK = () => Number(S.tournament.ratingK) || 24;
    function clone(v){ return JSON.parse(JSON.stringify(v)); }
    function normalize(raw){
      const s = Object.assign(clone(DEFAULT), raw || {});
      s.tournament = Object.assign(clone(DEFAULT.tournament), (raw || {}).tournament || {});
      s.bank = Object.assign(clone(DEFAULT.bank), (raw || {}).bank || {});
      s.bank.pcts = Array.isArray(s.bank.pcts) ? s.bank.pcts.concat(DEFAULT.bank.pcts).slice(0,8) : DEFAULT.bank.pcts.slice();
      ["players","matches","rounds","eliminationOrder","log","history"].forEach(k => { if(!Array.isArray(s[k])) s[k] = []; });
      s.nextPlayerId = Math.max(Number(s.nextPlayerId || 1), 1 + s.players.reduce((m,p)=>Math.max(m, Number(p.id||0)), 0));
      s.nextMatchId = Math.max(Number(s.nextMatchId || 1), 1 + s.matches.reduce((m,x)=>Math.max(m, Number(x.id||0)), 0));
      stripOldPreloads(s);
      return s;
    }
    function stripOldPreloads(s){
      if(s.phase !== "setup" || (s.players||[]).some(p=>!p.removed) || (s.matches||[]).length) return;
      const t=s.tournament, b=s.bank;
      if(t.name==="Green Rack Runner") t.name="";
      if(t.format==="double_elim") t.format="";
      if(t.pairingMode==="balanced") t.pairingMode="";
      if(t.seedMode==="manual") t.seedMode="";
      if(t.ratingEngine==="local_elo") t.ratingEngine="";
      if(Number(t.ratingBase)===500) t.ratingBase="";
      if(Number(t.ratingK)===24) t.ratingK="";
      if(Number(t.tables)===4) t.tables="";
      if(Number(t.raceTo)===3) t.raceTo="";
      if(Number(t.raceToFinal)===5) t.raceToFinal="";
      if(t.breakRule==="Winner breaks") t.breakRule="";
      if(Number(b.buyIn)===10 || Number(b.buyIn)===0) b.buyIn="";
      if(Number(b.sidePot)===0) b.sidePot="";
      if(Number(b.added)===0) b.added="";
      if(Number(b.paidPlaces)===3) b.paidPlaces="";
      if(Number(b.roundTo)===1) b.roundTo="";
      if(Array.isArray(b.pcts) && b.pcts.map(Number).join(",")==="70,30,0,0,0,0,0,0") b.pcts=["","","","","","","",""];
    }
    function loadState(){ try { const raw = localStorage.getItem(KEY); if(raw) return normalize(JSON.parse(raw)); } catch(e){} return clone(DEFAULT); }
    function loadPlayerDb(){ try { const raw = localStorage.getItem(PLAYER_DB_KEY); if(raw) return normalizePlayerDb(JSON.parse(raw)); } catch(e){} return normalizePlayerDb({}); }
    function loadSetupPresets(){ try { const raw = localStorage.getItem(SETUP_PRESETS_KEY); if(raw) return normalizeSetupPresets(JSON.parse(raw)); } catch(e){} return []; }
    function normalizeSetupPresets(raw){ return Array.isArray(raw) ? raw.filter(p=>p && p.name && p.params).map((p,i)=>Object.assign({id:p.id||("preset_"+Date.now()+"_"+i), createdAt:p.createdAt||NOW(), updatedAt:p.updatedAt||p.createdAt||NOW()}, p)) : []; }
    function normalizePlayerDb(raw){ const db=Object.assign({version:1,nextId:1,players:[]}, raw || {}); if(!Array.isArray(db.players)) db.players=[]; db.players.forEach(r=>{ r.id=Number(r.id||0); r.name=clean(r.name); r.key=r.key||nameKey(r.name); r.rating=Number(r.rating)||500; r.matches=Number(r.matches||0); r.wins=Number(r.wins||0); r.losses=Number(r.losses||0); r.racksWon=Number(r.racksWon||0); r.racksLost=Number(r.racksLost||0); r.events=Number(r.events||0); r.peakRating=Number(r.peakRating||r.rating); r.createdAt=r.createdAt||NOW(); r.lastSeen=r.lastSeen||r.createdAt; }); db.nextId=Math.max(Number(db.nextId||1),1+db.players.reduce((m,r)=>Math.max(m,Number(r.id||0)),0)); return db; }
    function save(){ localStorage.setItem(KEY, JSON.stringify(S)); scheduleSyncPush(); }
    function savePlayerDb(){ localStorage.setItem(PLAYER_DB_KEY, JSON.stringify(DB)); scheduleSyncPush(); }
    function saveSetupPresets(){ localStorage.setItem(SETUP_PRESETS_KEY, JSON.stringify(PRESETS)); scheduleSyncPush(); }
    const SYNC_URL = location.protocol === "http:" || location.protocol === "https:" ? location.origin : "http://127.0.0.1:8765";
    let SYNC_READY = !/^https?:/.test(location.protocol), SYNC_MUTED = false, SYNC_TIMER = null, SYNC_LAST = Number(S.syncUpdatedAt || 0);
    function meaningfulState(){ return activePlayers().length || S.matches.length || S.tournament.name || S.tournament.venue || Number(S.bank.buyIn||0) || DB.players.length || PRESETS.length; }
    function stampSync(){ S.syncUpdatedAt = Date.now(); SYNC_LAST = S.syncUpdatedAt; }
    function scheduleSyncPush(){ if(SYNC_MUTED || !SYNC_READY) return; stampSync(); clearTimeout(SYNC_TIMER); SYNC_TIMER = setTimeout(pushSync, 200); }
    async function pushSync(){ try{ await fetch(SYNC_URL+"/api/sync", { method:"POST", headers:{"content-type":"application/json"}, body:JSON.stringify({ updatedAt:SYNC_LAST, state:S, playerDb:DB, setupPresets:PRESETS }) }); }catch(e){} }
    async function pullSync(first){ try{ const r=await fetch(SYNC_URL+"/api/sync?ts="+Date.now()); if(!r.ok) return; const data=await r.json(); if(data.hasState && Number(data.updatedAt||0) > Number(S.syncUpdatedAt||0)){ SYNC_MUTED=true; S=normalize(data.state); DB=normalizePlayerDb(data.playerDb||{}); PRESETS=normalizeSetupPresets(data.setupPresets||[]); localStorage.setItem(KEY, JSON.stringify(S)); localStorage.setItem(PLAYER_DB_KEY, JSON.stringify(DB)); localStorage.setItem(SETUP_PRESETS_KEY, JSON.stringify(PRESETS)); SYNC_LAST=Number(data.updatedAt||0); SYNC_MUTED=false; render(); } else if(first && !data.hasState && meaningfulState()){ SYNC_READY=true; pushSync(); } if(first) SYNC_READY=true; }catch(e){ if(first) SYNC_READY=true; } }
    function startSync(){ pullSync(true); setInterval(()=>pullSync(false), 1200); }
    function snapshot(label){ const copy = clone(S); copy.history = []; S.history.push({ label, at: NOW(), state: copy }); if(S.history.length > MAX_HISTORY) S.history.shift(); }
    function log(type, text){ S.log.unshift({ at: NOW(), type, text }); S.log = S.log.slice(0,300); }
    function player(id){ return S.players.find(p => Number(p.id) === Number(id)); }
    function playerName(id){ const p = player(id); return p ? p.name : "Bye"; }
    function nameKey(name){ return clean(name).toLowerCase().replace(/[^a-z0-9]+/g,""); }
    function dbRecord(id){ return DB.players.find(r=>Number(r.id)===Number(id)); }
    function dbFindByName(name){ const key=nameKey(name); return DB.players.find(r=>r.key===key || (Array.isArray(r.aliases) && r.aliases.map(nameKey).includes(key))); }
    function rosterHasDb(id){ return S.players.some(p=>!p.removed && Number(p.dbId)===Number(id)); }
    function dbRatingFor(name, fallback){ const rec=dbFindByName(name); const n=Number(fallback); return Number.isFinite(n) && n>0 ? n : rec ? Number(rec.rating||fallbackRatingBase()) : fallbackRatingBase(); }
    function playerRating(p){ if(!p) return fallbackRatingBase(); const n=Number(p.rating); if(Number.isFinite(n) && n>0) return n; const rec=p.dbId ? dbRecord(p.dbId) : dbFindByName(p.name); return rec ? Number(rec.rating||fallbackRatingBase()) : fallbackRatingBase(); }

r</option></select></div><div><label>Rating Engine</label><select onchange="setTournament('ratingEngine',this.value)"><option value="" ${!S.tournament.ratingEngine?"selected":""}></option><option value="local_elo" ${S.tournament.ratingEngine==="local_elo"?"selected":""}>Local Elo</option><option value="manual" ${S.tournament.ratingEngine==="manual"?"selected":""}>Manual / Static</option><option value="off" ${S.tournament.ratingEngine==="off"?"selected":""}>Off</option></select></div><div><label>Base Rating</label><input type="number" min="1" max="9999" value="${esc(S.tournament.ratingBase)}" onchange="setTournament('ratingBase',this.value)"></div><div><label>Rating K</label><input type="number" min="1" max="100" value="${esc(S.tournament.ratingK)}" onchange="setTournament('ratingK',this.value)"></div><div><label>Tables</label><input type="number" min="1" max="32" value="${esc(S.tournament.tables)}" onchange="setTournament('tables',this.value)"></div><div><label>Race To</label><input type="number" min="1" max="99" value="${esc(S.tournament.raceTo)}" onchange="setTournament('raceTo',this.value)"></div><div><label>Final Race To</label><input type="number" min="1" max="99" value="${esc(S.tournament.raceToFinal)}" onchange="setTournament('raceToFinal',this.value)"></div><div><label>Break Rule</label><input value="${esc(S.tournament.breakRule)}" onchange="setTournament('breakRule',this.value)"></div></div><div class="hr"></div><button class="primary" onclick="startTournament()">Start / Resume</button> <button class="warn" onclick="reopenSetup()">Stop / Reopen Setup</button> <button class="danger" onclick="resetTournament()">Erase Tournament</button></section><section class="card"><h2>Saved Event Setups</h2>${renderSetupPresets()}<div class="hr"></div><h2>Format Math</h2><div class="list">${formatMath()}</div><div class="hr"></div>${checklist()}</section></div>`; }

    function saveCurrentSetupPreset(){ const input=$("setupPresetName"), name=clean(input && input.value); if(!name) return alert("Name this setup preset first."); const include=!!($("setupPresetIncludePlayers") && $("setupPresetIncludePlayers").checked); const params=currentSetupParams(include); const existing=PRESETS.find(p=>p.name.toLowerCase()===name.toLowerCase()); if(existing){ existing.params=params; existing.updatedAt=NOW(); } else PRESETS.push({id:"preset_"+Date.now(), name, params, createdAt:NOW(), updatedAt:NOW()}); saveSetupPresets(); log("preset","Saved setup preset "+name); render(); }

    function buildPlayer(data){

      const p={ id:S.nextPlayerId++, dbId:rec?rec.id:null, name, rating, phone:clean(data.phone), seed:data.seed?Number(data.seed):S.players.length+1, paid:!!data.paid, checkedIn:true, removed:false, wins:0, losses:0, byeCount:0, racksWon:0, racksLost:0, ratingDelta:0, createdAt:NOW() };

    function rebuildCurrentBracket(label){
      if(S.phase==="setup") return render();
      if(playedMatches().length) return alert("Shuffle is locked after a real match is scored. Use Undo or Erase Tournament first.");
      snapshot(label || "Rebuild bracket");

    function shuffleSeeds(){
      if(activePlayers().length < 2) return alert("Add at least two players before shuffle.");

    function startTournament(){
      if(activePlayers().length < 2) return alert("Need at least two checked-in players.");
      if(!S.tournament.format) return alert("Choose a tournament format.");
      if(!S.tournament.pairingMode) return alert("Choose a pairing / draw mode.");
      if(!S.tournament.seedMode) return alert("Choose a seeding mode.");
      if(Number(S.tournament.tables) < 1) return alert("Enter the number of tables.");
      if(Number(S.tournament.raceTo) < 1) return alert("Enter the race length.");
      snapshot("Start tournament");
      S.phase = "active"; S.tab = "bracket"; S.tournament.startedAt = S.tournament.startedAt || NOW(); S.tournament.finishedAt = "";
      S.matches = []; S.rounds = []; S.eliminationOrder = []; S.nextMatchId = 1;
      activePlayers().forEach((p,i)=>{ ensurePlayerMemory(p); p.wins=0; p.losses=0; p.byeCount=0; p.racksWon=0; p.racksLost=0; p.ratingDelta=0; p.seed=p.seed||i+1; if(!p.rating) p.rating=Math.round(playerRating(p)); });

    function createNextRound(showAlert){
      if(S.phase === "setup") return showAlert && alert("Start the tournament first.");
      if(S.phase === "complete") return showAlert && alert("Tournament is already complete.");
      if(!S.tournament.format) return showAlert && alert("Choose a tournament format.");
      if(!S.tournament.pairingMode) return showAlert && alert("Choose a pairing / draw mode.");
      if(openMatches().length) return showAlert && alert("Finish open matches before building the next round.");
      snapshot("Build next round");
      if(S.tournament.format === "round_robin"){
        if(!S.matches.length) return buildRoundRobin();
        finishTournament(); return render();
      }
      const alive = alivePlayers();
      if(alive.length <= 1){ finishTournament(); return render(); }
      const roundNo = (S.rounds.length ? Math.max(...S.rounds.map(r=>Number(r.roundNo)||0)) : 0) + 1;
      let created = [];
      if(S.tournament.format === "single_elim"){
        created = created.concat(pairPlayers(alive, alive.length===2 ? "Finals" : "Single Elimination", roundNo, alive.length===2 ? "Finals" : "Single Elimination Round "+roundNo, alive.length===2 ? Number(S.tournament.raceToFinal || S.tournament.raceTo) : Number(S.tournament.raceTo)));
      }
      else if(alive.length === 2) created = created.concat(pairPlayers(alive, "Finals", roundNo, finalLabel(alive), Number(S.tournament.raceToFinal || S.tournament.raceTo)));
      else {
        created = created.concat(pairPlayers(alive.filter(p=>p.losses===0), "Winners", roundNo, "Winners Round "+roundNo, Number(S.tournament.raceTo)));
        created = created.concat(pairPlayers(alive.filter(p=>p.losses===1), "Elimination", roundNo, "Elimination Round "+roundNo, Number(S.tournament.raceTo)));
      }
      assignTables();
      S.rounds.push({ roundNo, at:NOW(), count:created.length });
      log("round", created.length ? "Built round "+roundNo+" with "+created.length+" matches" : "Round "+roundNo+" had byes only");
      if(!created.length) setTimeout(()=>createNextRound(false),0);
      render();
    }
    function pairPlayers(group, division, roundNo, label, raceTo){
      let sorted = seedOrder(group);
      const created = [];
      if(sorted.length % 2 === 1){ const bye = sorted.shift(); if(bye){ bye.byeCount++; bye.wins++; S.matches.push({ id:S.nextMatchId++, roundNo, division, label:division+" Bye", playerA:bye.id, playerB:null, winner:bye.id, loser:null, scoreA:0, scoreB:0, status:"bye", table:null, raceTo, createdAt:NOW(), finishedAt:NOW(), notes:"Automatic bye" }); log("bye",bye.name+" receives a bye"); } }
      if(S.tournament.pairingMode === "random_draw") sorted = shuffle(sorted);
      while(sorted.length >= 2){ const a=sorted.shift(), b=S.tournament.pairingMode==="adjacent" ? sorted.shift() : sorted.pop(); const m={ id:S.nextMatchId++, roundNo, division, label, playerA:a.id, playerB:b.id, winner:null, loser:null, scoreA:0, scoreB:0, status:"ready", table:null, raceTo, createdAt:NOW(), startedAt:"", finishedAt:"", notes:"" }; S.matches.push(m); created.push(m); }
      return created;
    }
    function seedOrder(group){ return group.slice().sort((a,b)=>(a.byeCount-b.byeCount)||(a.losses-b.losses)||((b.wins||0)-(a.wins||0))||(S.tournament.seedMode==="rating" ? (playerRating(b)-playerRating(a)) : S.tournament.seedMode==="entry" ? (a.id-b.id) : ((a.seed||9999)-(b.seed||9999)))||a.name.localeCompare(b.name)); }
    function shuffle(list){ const out=list.slice(); for(let i=out.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [out[i],out[j]]=[out[j],out[i]]; } return out; }
    function buildRoundRobin(){
      const entrants = seedOrder(activePlayers());
      const raceTo = Number(S.tournament.raceTo);
      const created = [];
      for(let i=0;i<entrants.length;i++){
        for(let j=i+1;j<entrants.length;j++){
          const roundNo = j;
          const m={ id:S.nextMatchId++, roundNo, division:"Round Robin", label:"Round Robin Round "+roundNo, playerA:entrants[i].id, playerB:entrants[j].id, winner:null, loser:null, scoreA:0, scoreB:0, status:"ready", table:null, raceTo, createdAt:NOW(), startedAt:"", finishedAt:"", notes:"" };
          S.matches.push(m); created.push(m);
        }
      }
      assignTables();
      S.rounds.push({ roundNo:1, at:NOW(), count:created.length, format:"round_robin" });
      log("round","Built round robin with "+created.length+" matches");
      render();
    }
    function assignTables(){ const n = Math.max(1, Number(S.tournament.tables||1)); openMatches().forEach((m,i)=>m.table=(i%n)+1); }
    function finalLabel(alive){ return alive.some(p=>p.losses===0) && alive.some(p=>p.losses===1) ? "Finals" : "Final Reset"; }
    function match(id){ return S.matches.find(m=>Number(m.id)===Number(id)); }
    function matchById(id){ return match(id); }
    function playerById(id){ return player(id); }
    function adjustScore(id,side,delta){ const m=match(id); if(!m || m.status==="done" || m.status==="bye") return; snapshot("Adjust score"); if(side==="A") m.scoreA=Math.max(0,Number(m.scoreA||0)+Number(delta)); else m.scoreB=Math.max(0,Number(m.scoreB||0)+Number(delta)); if(Math.max(m.scoreA||0,m.scoreB||0)>=Number(m.raceTo||S.tournament.raceTo)-1 && Math.abs((m.scoreA||0)-(m.scoreB||0))===0) m.status="hill_hill"; render(); }
    function recordWinner(id,winnerId){
      const m=match(id); if(!m || m.status==="done" || m.status==="bye") return;
      const winner=player(winnerId); const loserId = Number(winnerId)===Number(m.playerA) ? m.playerB : m.playerA; const loser=player(loserId);
      if(!winner || !loser) return alert("Match player not found.");
      snapshot("Record winner");
      let winnerScore = Number(winner.id)===Number(m.playerA) ? Number(m.scoreA||0) : Number(m.scoreB||0);
      let loserScore = Number(winner.id)===Number(m.playerA) ? Number(m.scoreB||0) : Number(m.scoreA||0);
      const race = Math.max(1, Number(m.raceTo || S.tournament.raceTo || 1));
      if(winnerScore===0 && loserScore===0){
        winnerScore = race;
        if(Number(winner.id)===Number(m.playerA)) m.scoreA = winnerScore; else m.scoreB = winnerScore;
      }
      if(winnerScore <= loserScore){
        winnerScore = Math.max(loserScore + 1, race);
        if(Number(winner.id)===Number(m.playerA)) m.scoreA = winnerScore; else m.scoreB = winnerScore;
      }
      const ratingResult = ratingUpdate(winner, loser, winnerScore, loserScore, race);
      m.winner=winner.id; m.loser=loser.id; m.status="done"; m.finishedAt=NOW(); if(!m.startedAt) m.startedAt=m.finishedAt;
      winner.wins++; loser.losses++;
      winner.racksWon += winnerScore; winner.racksLost += loserScore; loser.racksWon += loserScore; loser.racksLost += winnerScore;
      updatePlayerMemoryFromMatch(winner, loser, winnerScore, loserScore, ratingResult);
      if(loser.losses >= lossLimit() && !S.eliminationOrder.includes(loser.id)) S.eliminationOrder.push(loser.id);
      log("match", winner.name+" defeated "+loser.name+" "+winnerScore+"-"+loserScore);
      assignTables(); if(S.tournament.format==="round_robin" ? !openMatches().length : alivePlayers().length <= 1) finishTournament(); render();
    }
    function setStatus(id,status){ const m=match(id); if(!m || m.status==="done" || m.status==="bye") return; snapshot("Set status"); m.status=status; if(status==="on_table" && !m.startedAt) m.startedAt=NOW(); log("match","Match "+id+" set to "+statusText(status)); render(); }
    function setMatchStatus(id,status){ return setStatus(id,status); }
    function toggleHill(id){ const m=match(id); if(!m || m.status==="done" || m.status==="bye") return; setStatus(id,m.status==="hill_hill"?"on_table":"hill_hill"); }
    function callMatch(id){ return setStatus(id,"called"); }
    function callAll(){ snapshot("Call all"); activeMatches().forEach(m=>{ if(m.status==="ready") m.status="called"; }); log("call","Called all live tables"); render(); }
    function callAllTables(){ return callAll(); }
    function finishTournament(){ const champ = alivePlayers()[0] || standings()[0]; S.phase="complete"; S.tournament.finishedAt = S.tournament.finishedAt || NOW(); if(champ) log("complete",champ.name+" wins the tournament"); }
    function stopTournamentKeepSetup(){ return reopenSetup(); }
    function reopenSetup(){ snapshot("Reopen setup"); S.phase="setup"; S.matches=[]; S.rounds=[]; S.eliminationOrder=[]; activePlayers().forEach(p=>{p.wins=0;p.losses=0;p.byeCount=0;p.racksWon=0;p.racksLost=0;}); render(); }
    function resetTournament(){ if(!confirm("Erase this tournament and start a blank one? This clears players, matches, money, and scores for the current event.")) return; S=clone(DEFAULT); log("system","Tournament erased"); render(); }
    function entryFee(){ return Number(S.bank.buyIn||0) + Number(S.bank.sidePot||0); }
    function payoutRuleText(){ return activePlayers().length <= 9 ? "9 or less: winner take all" : "10 or more: 1st and 2nd plus 3rd entry fee back"; }
    function calcPayouts(){
      const count=activePlayers().length, pot=totalPot(), roundTo=Math.max(1,Number(S.bank.roundTo||1));
      const names=S.bank.names||[];
      if(count <= 9) return [{ place:"1st", pct:100, amount:pot, name:names[0]||"" }];
      const third=Math.min(entryFee(), pot);
      const remaining=Math.max(0, pot-third);
      const firstPct=Math.max(0,Number(S.bank.pcts[0]||70)), secondPct=Math.max(0,Number(S.bank.pcts[1]||30));
      const pctTotal=firstPct+secondPct || 100;
      let first=Math.round((remaining*(firstPct/pctTotal))/roundTo)*roundTo;
      first=Math.min(first,remaining);
      const second=Math.max(0,remaining-first);
      return [
        { place:"1st", pct:firstPct, amount:first, name:names[0]||"" },
        { place:"2nd", pct:secondPct, amount:second, name:names[1]||"" },
        { place:"3rd", pct:0, amount:third, name:names[2]||"", locked:true }
      ];
    }
    function undo(){ const last=S.history.pop(); if(!last) return alert("No undo history."); const keep=S.history.slice(); S=normalize(last.state); S.history=keep; log("undo","Undid: "+last.label); render(); }
    function saveCheckpoint(){ save(); savePlayerDb(); log("save","Checkpoint saved"); alert("Saved checkpoint locally."); }
    function buildReport(){ const lines=[]; lines.push(S.tournament.name || "Green Rack Runner"); lines.push([S.tournament.venue,S.tournament.date].filter(Boolean).join(" | ")); lines.push("Phase: "+S.phase); lines.push("Format: "+formatLabel()); lines.push("Players: "+activePlayers().length); lines.push("Pot: "+money(totalPot())); lines.push(""); lines.push("STANDINGS"); standings().forEach((p,i)=>lines.push(`${i+1}. ${p.name} - ${p.wins||0}W/${p.losses||0}L - Rating ${Math.round(playerRating(p))} - ${p.paid?"Paid":"Due"}`)); lines.push(""); lines.push("OPEN MATCHES"); openMatches().forEach(m=>lines.push(`Table ${m.table||"-"}: ${playerName(m.playerA)} vs ${playerName(m.playerB)} - ${statusText(m.status)} - ${m.label}`)); lines.push(""); lines.push("PAYOUTS"); calcPayouts().forEach(p=>lines.push(`${p.place}: ${money(p.amount)}`)); return lines.join("\n"); }
    function copyDirectorReport(){ copyText(buildReport()); alert("Director report copied."); }
    function copyText(text){ if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text); }
    function closeModal(){ const host=$("modalHost"); if(host) host.innerHTML=""; }
    function openRosterManager(){ S.tab="players"; render(); }
    function openMatchManager(){ const host=$("modalHost"); if(!host) return; const matches=S.matches.filter(m=>m.status!=="bye"); host.innerHTML=`<div class="modalShade" onclick="closeModal()"><div class="modal" onclick="event.stopPropagation()"><div class="head"><div><h2>Match Manager</h2><div class="sub">${matches.length} matches | ${openMatches().length} open</div></div><button class="ghost" onclick="closeModal()">Close</button></div><div class="row"><button class="primary" onclick="createNextRound(true);openMatchManager()">Build Next</button><button class="good" onclick="callAll();openMatchManager()">Call All</button><button class="warn" onclick="copyDirectorReport()">Report</button></div><div class="hr"></div><div class="list">${matches.map(renderMatchManagerRow).join("") || '<div class="sub">No matches yet.</div>'}</div></div></div>`; }
    function renderMatchManagerRow(m){ const a=player(m.playerA), b=player(m.playerB); return `<div class="item"><span class="badge ${m.status==="done"?"good":m.status==="disputed"?"danger":"blue"}">T${m.table||"-"}</span><div><b>${esc(playerName(m.playerA))} vs ${esc(playerName(m.playerB))}</b><div class="sub">${esc(m.label)} | ${statusText(m.status)} | ${m.scoreA||0}-${m.scoreB||0}</div></div><div class="row">${m.status==="done"?"":`<button class="small" onclick="setStatus(${m.id},'called');openMatchManager()">Call</button><button class="small good" onclick="setStatus(${m.id},'on_table');openMatchManager()">Table</button>${a?`<button class="small primary" onclick="recordWinner(${m.id},${a.id});openMatchManager()">A Win</button>`:""}${b?`<button class="small primary" onclick="recordWinner(${m.id},${b.id});openMatchManager()">B Win</button>`:""}`}</div></div>`; }
    function validateState(x){
      if(!x || typeof x !== "object") throw new Error("Backup is not an object.");
      if(!Array.isArray(x.players) || !Array.isArray(x.matches)) throw new Error("Backup missing players or matches.");
      const ids = new Set(); x.players.forEach(p=>{ const id=Number(p.id); if(!id) throw new Error("Player missing id."); if(!p.name) throw new Error("Player missing name."); if(ids.has(id)) throw new Error("Duplicate player id."); ids.add(id); });
      const matchIds = new Set();
      x.matches.forEach(m=>{ const id=Number(m.id); if(!id || !m.status) throw new Error("Invalid match."); if(matchIds.has(id)) throw new Error("Duplicate match id."); matchIds.add(id); if(m.playerA && !ids.has(Number(m.playerA))) throw new Error("Match references missing player."); if(m.playerB && !ids.has(Number(m.playerB))) throw new Error("Match references missing player."); if(m.playerA && m.playerB && Number(m.playerA)===Number(m.playerB)) throw new Error("Match cannot reference the same player twice."); if(m.winner && !ids.has(Number(m.winner))) throw new Error("Match winner references missing player."); if(m.loser && !ids.has(Number(m.loser))) throw new Error("Match loser references missing player."); });
      return true;
    }
    function exportBackup(){ const payload={app:"Green Rack Runner", version:S.version, exportedAt:NOW(), state:S, playerDb:DB, setupPresets:PRESETS}; downloadBlob(new Blob([JSON.stringify(payload,null,2)],{type:"application/json"}), safeFile((S.tournament.name||"green-rack-runner")+"-backup.json")); }
    function importBackup(file){ if(!file) return; const r=new FileReader(); r.onload=()=>{ try{ const parsed=JSON.parse(r.result); const nextState=parsed.state || parsed; validateState(nextState); snapshot("Import backup"); S=normalize(nextState); if(parsed.playerDb) DB=normalizePlayerDb(parsed.playerDb); if(parsed.setupPresets) PRESETS=normalizeSetupPresets(parsed.setupPresets); log("backup","Imported backup"); render(); } catch(e){ alert("Backup import failed: "+e.message); } }; r.readAsText(file); }
    function exportCSV(){ const rows=[["section","id","name","wins","losses","racksWon","racksLost","paid"],...activePlayers().map(p=>["player",p.id,p.name,p.wins,p.losses,p.racksWon,p.racksLost,p.paid]),["match_id","round","division","playerA","playerB","winner","scoreA","scoreB","status"],...S.matches.map(m=>["match",m.id,m.roundNo,m.division,playerName(m.playerA),playerName(m.playerB),m.winner?playerName(m.winner):"",m.scoreA,m.scoreB,m.status])]; downloadBlob(new Blob([rows.map(r=>r.map(v=>`"${String(v??"").replace(/"/g,'""')}"`).join(",")).join("\n")],{type:"text/csv"}), safeFile((S.tournament.name||"green-rack-runner")+"-export.csv")); }
    function exportPlayerDbCSV(){ const rows=[["id","name","rating","peakRating","matches","wins","losses","racksWon","racksLost","lastSeen"],...DB.players.map(r=>[r.id,r.name,Math.round(r.rating||0),Math.round(r.peakRating||r.rating||0),r.matches||0,r.wins||0,r.losses||0,r.racksWon||0,r.racksLost||0,r.lastSeen||""])]; downloadBlob(new Blob([rows.map(r=>r.map(v=>`"${String(v??"").replace(/"/g,'""')}"`).join(",")).join("\n")],{type:"text/csv"}), safeFile("green-rack-runner-player-database.csv")); }
    function downloadBlob(blob,name){ const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 500); }
    function safeFile(name){ return String(name).toLowerCase().replace(/[^a-z0-9._-]+/g,"-").replace(/-+/g,"-"); }
    function copyStandings(){ navigator.clipboard && navigator.clipboard.writeText(standings().map((p,i)=>`${i+1}. ${p.name} - ${p.wins||0}W/${p.losses||0}L`).join("\n")); alert("Standings copied."); }
    $("backupFile").addEventListener("change", ev => importBackup(ev.target.files[0]));
    startSync();
    render();
  </script>
</body>
