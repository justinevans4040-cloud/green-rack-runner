<script>

"use strict";
const STORE_KEY="rack_runner_director_v15",MAX_HISTORY=60,NOW=()=>new Date().toISOString();
const DEFAULT_STATE={version:17,tab:"home",phase:"setup",publicMode:false,selectedMatchId:null,tournament:{name:"Rack Runner Mobile",venue:"",director:"",date:new Date().toISOString().slice(0,10),format:"double_elim",tables:4,raceTo:3,raceToFinal:5,breakRule:"Winner breaks",startedAt:"",finishedAt:"",locked:false},players:[],matches:[],rounds:[],eliminationOrder:[],nextPlayerId:1,nextMatchId:1,bank:{buyIn:10,added:0,sidePot:0,paidPlaces:3,roundTo:1,pcts:[50,30,20,0,0,0,0,0],payoutsPaid:[false,false,false,false,false,false,false,false]},log:[],history:[],filters:{playerSearch:""},voice:{last:"",supported:false}};
let S=loadState();
function $(id){return document.getElementById(id)}function money(n){return "$"+Number(n||0).toLocaleString(undefined,{minimumFractionDigits:0,maximumFractionDigits:0})}function esc(v){return String(v??"").replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]))}function cleanName(v){return String(v||"").trim().replace(/\s+/g," ")}function clamp(n,min,max){return Math.max(min,Math.min(max,Number(n||0)))}function playerById(id){return S.players.find(p=>p.id===Number(id))}function matchById(id){return S.matches.find(m=>m.id===Number(id))}function playerName(id){const p=playerById(id);return p?p.name:"Bye"}function activePlayers(){return S.players.filter(p=>!p.removed&&p.checkedIn!==false)}function alivePlayers(){return activePlayers().filter(p=>p.losses<2)}function openMatches(){return S.matches.filter(m=>!["done","bye"].includes(m.status))}function activeMatches(){return openMatches().slice(0,Math.max(1,Number(S.tournament.tables||1)))}function waitingMatches(){return openMatches().slice(Math.max(1,Number(S.tournament.tables||1)))}function totalPot(){return activePlayers().length*Number(S.bank.buyIn||0)+activePlayers().length*Number(S.bank.sidePot||0)+Number(S.bank.added||0)}function dueTotal(){return activePlayers().filter(p=>!p.paid).length*(Number(S.bank.buyIn||0)+Number(S.bank.sidePot||0))}
function loadState(){try{const raw=localStorage.getItem(STORE_KEY);if(raw)return normalizeState(JSON.parse(raw))}catch(e){console.warn(e)}return structuredClone(DEFAULT_STATE)}
function normalizeState(st){const s=structuredClone(DEFAULT_STATE);Object.assign(s,st||{});s.tournament=Object.assign({},DEFAULT_STATE.tournament,st.tournament||{});s.bank=Object.assign({},DEFAULT_STATE.bank,st.bank||{});s.bank.pcts=Array.isArray(s.bank.pcts)?s.bank.pcts.concat(DEFAULT_STATE.bank.pcts).slice(0,8):DEFAULT_STATE.bank.pcts.slice();s.bank.payoutsPaid=Array.isArray(s.bank.payoutsPaid)?s.bank.payoutsPaid.concat(DEFAULT_STATE.bank.payoutsPaid).slice(0,8):DEFAULT_STATE.bank.payoutsPaid.slice();["players","matches","rounds","eliminationOrder","log","history"].forEach(k=>{if(!Array.isArray(s[k]))s[k]=[]});s.filters=Object.assign({},DEFAULT_STATE.filters,st.filters||{});s.voice=Object.assign({},DEFAULT_STATE.voice,st.voice||{});return s}
function save(){localStorage.setItem(STORE_KEY,JSON.stringify(S))}
function snapshot(label){const copy=structuredClone(S);copy.history=[];S.history.push({label,at:NOW(),state:copy});if(S.history.length>MAX_HISTORY)S.history.shift()}
function logEvent(type,text){S.log.unshift({at:NOW(),type,text});S.log=S.log.slice(0,250)}
function render(){save();document.body.classList.toggle("publicMode",!!S.publicMode);renderShell();const fn={home:renderHome,players:renderPlayers,bank:renderBank,bracket:renderBracket,setup:renderSetup}[S.tab]||renderHome;$("main").innerHTML=fn();renderDock()}
function renderShell(){const root=$("app");root.innerHTML=`<div class="topbar"><div class="brand"><h1>${esc(S.tournament.name||"Rack Runner Mobile")} <span class="badge cyan">Tonight V29</span></h1><p>${esc(S.tournament.venue||"Phone tournament control")} · ${esc(S.tournament.date||"")} · ${phaseBadge()}</p></div><div class="topActions directorOnly"><button class="ghost" onclick="togglePublic()">${S.publicMode?"Director":"Display"}</button><button class="ghost" onclick="startVoice()">Voice</button><button class="warn" onclick="copyDirectorReport()">Report</button><button class="primary" onclick="exportBackup()">Download Backup</button></div></div>${renderStats()}<main id="main"></main><div id="modalHost"></div><div class="tabDock" id="dock"></div>`}
function phaseBadge(){return S.phase==="setup"?`<span class="badge warn">Setup</span>`:S.phase==="active"?`<span class="badge good">Live</span>`:S.phase==="complete"?`<span class="badge pink">Complete</span>`:`<span class="badge">Ready</span>`}
function renderStats(){const open=openMatches().length,active=activeMatches().length,disputed=S.matches.filter(m=>m.status==="disputed").length,unpaid=activePlayers().filter(p=>!p.paid).length;return `<div class="statGrid"><div class="stat cyan" onclick="go('players')"><span>Players</span><b>${activePlayers().length}</b></div><div class="stat" onclick="go('home')"><span>Alive</span><b>${alivePlayers().length}</b></div><div class="stat pink" onclick="go('home')"><span>Tables Live</span><b>${active}/${S.tournament.tables}</b></div><div class="stat" onclick="go('bracket')"><span>Open Matches</span><b>${open}</b></div><div class="stat" onclick="go('bank')"><span>Pot</span><b>${money(totalPot())}</b></div><div class="stat" onclick="go('home')"><span>Alerts</span><b>${disputed+unpaid}</b></div></div>`}
function renderDock(){const tabs=[["home","Home"],["players","Players"],["bank","Bank"],["bracket","Bracket"],["setup","Setup"]];$("dock").innerHTML=tabs.map(([id,label])=>`<button class="${S.tab===id?"active":""}" onclick="go('${id}')">${label}</button>`).join("")}

function emergencyDownloadBackup(){
  try{
    if(typeof save === "function") save();
    const state = (typeof S !== "undefined") ? S : {};
    const nameBase = (state && state.tournament && state.tournament.name) ? state.tournament.name : "rack-runner-tournament";
    const stamp = new Date().toISOString().replace(/[:.]/g,"-").slice(0,19);
    const filename = String(nameBase).toLowerCase().replace(/[^a-z0-9._-]+/g,"-").replace(/-+/g,"-") + "-backup-" + stamp + ".json";
    const blob = new Blob([JSON.stringify(state,null,2)], {type:"application/json"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 700);
    if(typeof logEvent === "function") logEvent("backup", "Downloaded backup file.");
    alert("Backup downloaded.\\n\\nCheck your phone Downloads folder.");
  }catch(e){
    alert("Backup failed: " + (e && e.message ? e.message : e));
  }
}

const ARCHIVE_KEY = "rack_runner_tournament_archives_v1";

function deepCopyStateForArchive(){
  try{
    return JSON.parse(JSON.stringify(S));
  }catch(e){
    return {};
  }
}

function tournamentArchiveSummary(state){
  const champ = championCandidate();
  const players = Array.isArray(state.players) ? state.players.filter(function(p){ return !p.removed; }) : [];
  return {
    id: "archive-" + Date.now(),
    archivedAt: new Date().toISOString(),
    name: state.tournament && state.tournament.name ? state.tournament.name : "Rack Runner Tournament",
    date: state.tournament && state.tournament.date ? state.tournament.date : new Date().toISOString().slice(0,10),
    championName: champ ? champ.name : "",
    playerCount: players.length,
    phase: state.phase || "",
    totalMatches: Array.isArray(state.matches) ? state.matches.length : 0
  };
}

function loadTournamentArchives(){
  try{
    const raw = localStorage.getItem(ARCHIVE_KEY);
    const parsed = raw ? JSON.parse(raw) : [];
    return Array.isArray(parsed) ? parsed : [];
  }catch(e){
    return [];
  }
}

function saveTournamentArchiveRecord(record){
  const archives = loadTournamentArchives();
  archives.unshift(record);
  localStorage.setItem(ARCHIVE_KEY, JSON.stringify(archives.slice(0,50)));
}

function archiveDownloadFile(record){
  const nameBase = (record.summary && record.summary.name) ? record.summary.name : "rack-runner-tournament";
  const champBase = (record.summary && record.summary.championName) ? record.summary.championName : "no-champion";
  const stamp = new Date().toISOString().replace(/[:.]/g,"-").slice(0,19);
  const filename = String(nameBase + "-" + champBase + "-archive-" + stamp + ".json")
    .toLowerCase()
    .replace(/[^a-z0-9._-]+/g,"-")
    .replace(/-+/g,"-");

  const blob = new Blob([JSON.stringify(record,null,2)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 900);
}

function freshStateForNextTournament(){
  const oldName = S.tournament && S.tournament.name ? S.tournament.name : "Rack Runner Tournament";
  const oldVenue = S.tournament && S.tournament.venue ? S.tournament.venue : "";
  const oldDirector = S.tournament && S.tournament.director ? S.tournament.director : "";
  const tables = S.tournament && S.tournament.tables ? S.tournament.tables : 4;
  const raceTo = S.tournament && S.tournament.raceTo ? S.tournament.raceTo : 3;
  const raceToFinal = S.tournament && S.tournament.raceToFinal ? S.tournament.raceToFinal : 5;
  const breakRule = S.tournament && S.tournament.breakRule ? S.tournament.breakRule : "Winner breaks";
  const bank = S.bank ? JSON.parse(JSON.stringify(S.bank)) : null;

  const next = JSON.parse(JSON.stringify(DEFAULT_STATE));
  next.version = 28;
  next.phase = "setup";
  next.tab = "players";
  next.tournament.name = oldName;
  next.tournament.venue = oldVenue;
  next.tournament.director = oldDirector;
  next.tournament.date = new Date().toISOString().slice(0,10);
  next.tournament.tables = tables;
  next.tournament.raceTo = raceTo;
  next.tournament.raceToFinal = raceToFinal;
  next.tournament.breakRule = breakRule;
  if(bank) next.bank = bank;
  if(!next.meta) next.meta = {};
  next.meta.lastChampionKeepsakeFor = "";
  next.meta.lastChampionKeepsakeAt = "";
  return next;
}

function archiveAndResetTournament(){
  const champ = championCandidate();
  const champText = champ ? champ.name : "No champion detected";
  const msg = [
    "ARCHIVE / NEW TOURNAMENT",
    "",
    "This saves this tournament record and downloads an archive file.",
    "",
    "Champion: " + champText,
    "",
    "Then it resets the app for the next tournament.",
    "",
    "Keeps for next event:",
    "• tournament name",
    "• venue/director",
    "• Bank settings",
    "• table/race settings",
    "",
    "Clears for next event:",
    "• players",
    "• matches",
    "• scores",
    "• bracket",
    "",
    "Continue?"
  ].join("\\n");

  if(!confirm(msg)) return;

  try{
    if(typeof save === "function") save();

    const stateCopy = deepCopyStateForArchive();
    const summary = tournamentArchiveSummary(stateCopy);
    const record = {
      summary: summary,
      state: stateCopy
    };

    saveTournamentArchiveRecord(record);
    archiveDownloadFile(record);

    S = freshStateForNextTournament();
    if(typeof save === "function") save();
    if(typeof render === "function") render();

    alert("Tournament archived.\\n\\nA backup file downloaded, and the app is reset for the next tournament.");
  }catch(e){
    alert("Archive/reset failed: " + (e && e.message ? e.message : e));
  }
}

function wrapFinishTournamentForAutoPrize(){
  if(typeof finishTournament !== "function") return;
  if(finishTournament.__autoWrapped) return;
  const original = finishTournament;
  const wrapped = function(){
    const result = original.apply(this, arguments);
    try{
      setTimeout(function(){
        autoChampionPrizeFlow();
      }, 180);
    }catch(e){}
    return result;
  };
  wrapped.__autoWrapped = true;
  wrapped.__original = original;
  finishTournament = wrapped;
}

function installAutoChampionFlow(){
  wrapFinishTournamentForAutoPrize();
  try{
    if((S.phase || "") === "complete"){
      setTimeout(function(){ autoChampionPrizeFlow(); }, 200);
    }
  }catch(e){}
}

function championCandidate(){
  try{
    if(typeof alivePlayers === "function"){
      const alive = alivePlayers();
      if(alive.length === 1) return alive[0];
    }
  }catch(e){}
  try{
    if(Array.isArray(S.players)){
      const active = S.players.filter(function(p){ return !p.removed; });
      const sorted = active.slice().sort(function(a,b){
        const aw = Number(a.wins||0), bw = Number(b.wins||0);
        const al = Number(a.losses||0), bl = Number(b.losses||0);
        if(al !== bl) return al - bl;
        return bw - aw;
      });
      return sorted[0] || null;
    }
  }catch(e){}
  return null;
}

function wrapCanvasText(ctx, text, x, y, maxWidth, lineHeight){
  const words = String(text || "").split(/\s+/);
  let line = "";
  let lines = [];
  for(let n=0;n<words.length;n++){
    const testLine = line ? line + " " + words[n] : words[n];
    const metrics = ctx.measureText(testLine);
    if(metrics.width > maxWidth && n > 0){
      lines.push(line);
      line = words[n];
    }else{
      line = testLine;
    }
  }
  if(line) lines.push(line);
  lines.forEach(function(l, i){ ctx.fillText(l, x, y + i * lineHeight); });
  return lines.length;
}

function generateChampionKeepsake(champ){
  const canvas = document.createElement("canvas");
  canvas.width = 1400;
  canvas.height = 1800;
  const ctx = canvas.getContext("2d");

  const bg = ctx.createLinearGradient(0,0,canvas.width,canvas.height);
  bg.addColorStop(0,"#070b14");
  bg.addColorStop(.5,"#111827");
  bg.addColorStop(1,"#05070d");
  ctx.fillStyle = bg;
  ctx.fillRect(0,0,canvas.width,canvas.height);

  function circle(x,y,r,color,alpha){
    ctx.save();
    ctx.globalAlpha = alpha;
    const g = ctx.createRadialGradient(x,y,0,x,y,r);
    g.addColorStop(0,color);
    g.addColorStop(1,"rgba(0,0,0,0)");
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(x,y,r,0,Math.PI*2);
    ctx.fill();
    ctx.restore();
  }
  circle(220,220,260,"#27e6ff",0.18);
  circle(1180,320,300,"#ffd166",0.16);
  circle(1050,1480,320,"#3dff9f",0.10);

  ctx.strokeStyle = "rgba(255,209,102,0.9)";
  ctx.lineWidth = 8;
  roundRect(ctx, 48, 48, canvas.width-96, canvas.height-96, 34, false, true);
  ctx.strokeStyle = "rgba(39,230,255,0.35)";
  ctx.lineWidth = 3;
  roundRect(ctx, 76, 76, canvas.width-152, canvas.height-152, 28, false, true);

  ctx.textAlign = "center";
  ctx.fillStyle = "#ffd166";
  ctx.font = "700 44px Arial";
  ctx.fillText("RACK RUNNER", canvas.width/2, 165);
  ctx.fillStyle = "#ffffff";
  ctx.font = "900 110px Arial";
  ctx.fillText("TOURNAMENT", canvas.width/2, 295);
  ctx.fillStyle = "#27e6ff";
  ctx.font = "900 120px Arial";
  ctx.fillText("CHAMPION", canvas.width/2, 415);

  ctx.save();
  ctx.translate(canvas.width/2, 595);
  ctx.fillStyle = "#0b1220";
  ctx.beginPath();
  ctx.arc(0,0,120,0,Math.PI*2);
  ctx.fill();
  ctx.lineWidth = 10;
  ctx.strokeStyle = "#ffd166";
  ctx.stroke();
  ctx.fillStyle = "#ffffff";
  ctx.beginPath();
  ctx.arc(0,0,58,0,Math.PI*2);
  ctx.fill();
  ctx.fillStyle = "#111827";
  ctx.font = "900 84px Arial";
  ctx.fillText("1", 0, 28);
  ctx.restore();

  ctx.fillStyle = "#ffffff";
  ctx.font = "700 34px Arial";
  ctx.fillText("Presented to", canvas.width/2, 770);

  ctx.fillStyle = "#ffd166";
  ctx.font = "900 92px Arial";
  wrapCanvasText(ctx, champ.name || "Champion", canvas.width/2, 905, 980, 104);

  const tName = (S && S.tournament && S.tournament.name) ? S.tournament.name : "Pool Tournament";
  ctx.fillStyle = "#d7e4ff";
  ctx.font = "700 34px Arial";
  ctx.fillText("for winning", canvas.width/2, 1085);
  ctx.fillStyle = "#27e6ff";
  ctx.font = "800 54px Arial";
  wrapCanvasText(ctx, tName, canvas.width/2, 1160, 980, 64);

  const placeY = 1320;
  ctx.fillStyle = "rgba(255,255,255,.05)";
  roundRect(ctx, 170, placeY-64, canvas.width-340, 250, 26, true, false);
  ctx.strokeStyle = "rgba(255,255,255,.12)";
  ctx.lineWidth = 2;
  roundRect(ctx, 170, placeY-64, canvas.width-340, 250, 26, false, true);

  ctx.fillStyle = "#ffffff";
  ctx.font = "700 30px Arial";
  ctx.textAlign = "left";
  ctx.fillText("Champion:", 220, placeY);
  ctx.fillStyle = "#ffd166";
  ctx.font = "900 40px Arial";
  ctx.fillText(champ.name || "Champion", 430, placeY);

  ctx.fillStyle = "#ffffff";
  ctx.font = "700 30px Arial";
  ctx.fillText("Date:", 220, placeY + 68);
  ctx.fillStyle = "#d7e4ff";
  ctx.font = "800 34px Arial";
  ctx.fillText(championDateText(), 430, placeY + 68);

  ctx.fillStyle = "#ffffff";
  ctx.font = "700 30px Arial";
  ctx.fillText("Record:", 220, placeY + 136);
  ctx.fillStyle = "#3dff9f";
  ctx.font = "800 34px Arial";
  ctx.fillText(String(Number(champ.wins||0)) + " wins · " + String(Number(champ.losses||0)) + " losses", 430, placeY + 136);

  ctx.textAlign = "center";
  ctx.fillStyle = "#b8c8e4";
  ctx.font = "700 30px Arial";
  ctx.fillText("Thanks for playing. Keep shooting.", canvas.width/2, 1670);
  ctx.fillStyle = "#6a7a96";
  ctx.font = "700 24px Arial";
  ctx.fillText("Generated by Rack Runner", canvas.width/2, 1715);

  const fileBase = String((champ.name || "champion")).toLowerCase().replace(/[^a-z0-9._-]+/g, "-").replace(/-+/g, "-");
  const tBase = String(tName || "tournament").toLowerCase().replace(/[^a-z0-9._-]+/g, "-").replace(/-+/g, "-");
  const fileName = fileBase + "-" + tBase + "-champion-card.png";

  canvas.toBlob(function(blob){
    if(!blob){
      alert("Could not generate champion image.");
      return;
    }
    try{
      const file = new File([blob], fileName, {type:"image/png"});
      const canShare = !!(navigator.share && navigator.canShare && navigator.canShare({files:[file]}));
      if(canShare){
        navigator.share({
          files:[file],
          title:"Tournament Champion",
          text:"Champion keepsake for " + (champ.name || "the winner")
        }).catch(function(){
          downloadChampionBlob(blob, fileName);
        });
      }else{
        downloadChampionBlob(blob, fileName);
      }
    }catch(e){
      downloadChampionBlob(blob, fileName);
    }
  }, "image/png");
}

function downloadChampionBlob(blob, fileName){
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = fileName;
  document.body.appendChild(a);
  a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 900);
  alert("Champion keepsake created.\n\nCheck your phone downloads or share sheet.");
}

function roundRect(ctx, x, y, width, height, radius, fill, stroke){
  if (typeof radius === "number"){
    radius = {tl: radius, tr: radius, br: radius, bl: radius};
  } else {
    const defaultRadius = {tl: 0, tr: 0, br: 0, bl: 0};
    for (var side in defaultRadius) radius[side] = radius[side] || defaultRadius[side];
  }
  ctx.beginPath();
  ctx.moveTo(x + radius.tl, y);
  ctx.lineTo(x + width - radius.tr, y);
  ctx.quadraticCurveTo(x + width, y, x + width, y + radius.tr);
  ctx.lineTo(x + width, y + height - radius.br);
  ctx.quadraticCurveTo(x + width, y + height, x + width - radius.br, y + height);
  ctx.lineTo(x + radius.bl, y + height);
  ctx.quadraticCurveTo(x, y + height, x, y + height - radius.bl);
  ctx.lineTo(x, y + radius.tl);
  ctx.quadraticCurveTo(x, y, x + radius.tl, y);
  ctx.closePath();
  if(fill) ctx.fill();
  if(stroke) ctx.stroke();
}

function playerProfileSave(id){
  const p = playerProfileFind(id);
  if(!p) return alert("Player not found.");
  const name = String(document.getElementById("profileName")?.value || "").trim().replace(/\s+/g," ");
  if(!name) return alert("Player name cannot be blank.");
  const duplicate = Array.isArray(S.players) && S.players.some(function(other){
    return !other.removed && Number(other.id) !== Number(id) && String(other.name||"").toLowerCase() === name.toLowerCase();

  if(typeof snapshot === "function") snapshot("Save player profile");
  p.name = name;
  p.phone = String(document.getElementById("profilePhone")?.value || "").trim();
  p.rating = String(document.getElementById("profileRating")?.value || "").trim();
  p.notes = String(document.getElementById("profileNotes")?.value || "").trim();

function playerProfileRemove(id){

  }

function matchManagerRecordWinner(matchId, winnerId){
  const m = typeof matchById === "function" ? matchById(matchId) : (S.matches||[]).find(function(x){ return Number(x.id) === Number(matchId); });
  const winner = typeof playerById === "function" ? playerById(winnerId) : null;
  if(!m || !winner) return alert("Match or winner not found.");
  const loserId = Number(winnerId) === Number(m.playerA) ? m.playerB : m.playerA;
  const loser = typeof playerById === "function" ? playerById(loserId) : null;
  if(!loser) return alert("Loser not found.");
  if(!confirm(winner.name + " wins?\\n\\n" + loser.name + " gets one loss.")) return;

  if(typeof snapshot === "function") snapshot("Score match");
  m.winner = winner.id;
  m.loser = loser.id;
  m.status = "done";
  m.finishedAt = (typeof NOW === "function" ? NOW() : new Date().toISOString());
  if(!m.startedAt) m.startedAt = m.finishedAt;

  winner.wins = Number(winner.wins || 0) + 1;
  loser.losses = Number(loser.losses || 0) + 1;

  if(loser.losses >= 2 && Array.isArray(S.eliminationOrder) && !S.eliminationOrder.includes(loser.id)){
    S.eliminationOrder.push(loser.id);
  }
  if(typeof logEvent === "function") logEvent("match", winner.name + " defeated " + loser.name);

  if(typeof assignTables === "function") assignTables();

  const remainingOpen = matchManagerOpenMatches().filter(function(x){ return Number(x.id) !== Number(matchId); });
  const aliveAfter = matchManagerAlivePlayers();

  if(aliveAfter.length <= 1){
    if(typeof finishTournament === "function") finishTournament();
  }else if(remainingOpen.length === 0){
    if(typeof createNextRound === "function"){
      createNextRound(false);
    }
  }

  if(typeof save === "function") save();
  if(typeof render === "function") render();
  renderMatchManager();
}

function buildNextRoundFromMatchManager(){
  const open = matchManagerOpenMatches();
  if(open.length){
    alert("There are still open matches. Score those winners first.");
    return;
  }
  if(typeof createNextRound === "function"){
    createNextRound(true);
    if(typeof save === "function") save();
    if(typeof render === "function") render();
    renderMatchManager();
  }else{
    alert("Build next round function not found.");
  }
}

function rosterAddPlayer(){

function stopTournamentKeepSetup(){
  const played = Array.isArray(S.matches) ? S.matches.filter(m => m.status === "done" && m.playerB !== null).length : 0;
  let msg = "STOP TOURNAMENT / REOPEN SETUP\n\n";
  msg += "This keeps:\n";
  msg += "• players\n• paid/unpaid\n• Bank/money settings\n• table count\n• race/rules\n• player notes\n\n";
  msg += "This clears:\n";
  msg += "• generated bracket\n• matches\n• scores\n• win/loss records\n\n";
  msg += played ? "WARNING: completed match results will be removed.\n\n" : "Use this when you started too early or need to add/remove players.\n\n";
  msg += "Continue?";
  if(!confirm(msg)) return;
  if(typeof snapshot === "function") snapshot("Stop tournament / reopen setup");
  resetAutoChampionHandled();
  S.phase = "setup";
  S.selectedMatchId = null;
  S.matches = [];
  S.rounds = [];
  S.eliminationOrder = [];
  S.nextMatchId = 1;
  if(S.tournament){
    S.tournament.startedAt = "";
    S.tournament.finishedAt = "";
  }
  if(typeof activePlayers === "function"){
    activePlayers().forEach(p => {
      p.wins = 0;
      p.losses = 0;
      p.byeCount = 0;
      p.scoreFor = 0;
      p.scoreAgainst = 0;
    });
  }else if(Array.isArray(S.players)){
    S.players.forEach(p => {
      if(!p.removed){
        p.wins = 0;
        p.losses = 0;
        p.byeCount = 0;
        p.scoreFor = 0;
        p.scoreAgainst = 0;
      }
    });
  }
  if(typeof logEvent === "function") logEvent("setup", "Tournament stopped. Setup reopened.");
  S.tab = "players";
  if(typeof save === "function") save();
  if(typeof render === "function") render();
  setTimeout(() => alert("Tournament stopped. Setup is open.\n\nAdd/remove players, shuffle players, save, then start again."), 80);
}
function reopenSetup(){
  if(S.phase === "setup"){
    S.tab = "players";
    render();
    return;
  }
  stopTournamentKeepSetup();
}

function fighterBlock(m,p,side){if(!p)return `<div class="fighter playerClickable" data-player-id="${p.id}"><div><div class="fighterName">Bye</div></div></div>`;const score=side==="a"?m.scoreA||0:m.scoreB||0;return `<div class="fighter"><div><div class="fighterName">${esc(p.name)}</div><div class="fighterSub">${p.wins||0}W · ${p.losses||0}L ${p.rating?"· Rating "+esc(p.rating):""}</div></div><div class="scoreBox directorOnly"><button class="tiny" onclick="adjustScore(${m.id},'${side}',-1)">−</button><div class="score">${score}</div><button class="tiny" onclick="adjustScore(${m.id},'${side}',1)">+</button><button class="good small" onclick="recordWinner(${m.id},${p.id})">Win</button></div></div>`}
function renderOnDeck(m){return `<div class="onDeckItem"><span class="badge">${m.division}</span><div><div class="nameLine">${esc(playerName(m.playerA))} vs ${esc(playerName(m.playerB))}</div><div class="subLine">${esc(m.label)} · Race ${m.raceTo||S.tournament.raceTo}</div></div><button class="primary small directorOnly" onclick="callMatch(${m.id})">Call</button></div>`}
function renderAlerts(){const alerts=[],unpaid=activePlayers().filter(p=>!p.paid),disputed=S.matches.filter(m=>m.status==="disputed");if(unpaid.length)alerts.push([`Unpaid players: ${unpaid.length}`,`Due now: ${money(dueTotal())}`,"bank","warn"]);if(disputed.length)alerts.push([`Disputes: ${disputed.length}`,disputed.map(m=>`Match ${m.id}`).join(", "),"home","danger"]);if(S.phase==="active"&&!openMatches().length&&alivePlayers().length>1)alerts.push(["Round complete","Build the next round when ready.","home","good"]);if(S.phase==="complete")alerts.push(["Tournament complete","Finish payout tracking and copy the director report.","bracket","good"]);if(!alerts.length)return `<div class="notice">Nothing needs attention.</div>`;return alerts.map(([title,body,tab,kind])=>`<div class="onDeckItem"><span class="badge ${kind}">${kind}</span><div><div class="nameLine">${esc(title)}</div><div class="subLine">${esc(body)}</div></div><button class="ghost small" onclick="go('${tab}')">Open</button></div>`).join("")}

function statusBadgeClass(st){return({ready:"",called:"cyan",on_table:"good",hill_hill:"warn",disputed:"danger",done:"good",bye:"good"})[st]||""}function statusLabel(st){return({ready:"Ready",called:"Called",on_table:"On Table",hill_hill:"Hill-Hill",disputed:"Disputed",done:"Done",bye:"Bye"})[st]||st}
function renderPlayers(){const q=String(S.filters.playerSearch||"").toLowerCase(),players=S.players.filter(p=>!p.removed&&(!q||p.name.toLowerCase().includes(q)));return `${renderEmergencyPlayerCard()}<div class="grid2"><div class="card directorOnly"><div class="card stopPanel"><h2>Need to restart setup?</h2><button class="stopButton wide" onclick="stopTournamentKeepSetup()">STOP / REOPEN SETUP</button><p class="subLine">Keeps players and money. Clears bracket/matches so you can add/remove players and start clean.</p></div><h2>Player Desk</h2><div class="grid2"><div><label>Name</label><input id="pName" placeholder="Player name"></div><div><label>Phone / Contact</label><input id="pPhone" placeholder="Optional"></div><div><label>Rating / Fargo / Skill</label><input id="pRating" placeholder="Optional"></div><div><label>Seed</label><input id="pSeed" type="number" placeholder="Auto"></div></div><div class="hr"></div><button class="primary wide" onclick="addPlayerFromForm()">Add Player</button><div class="hr"></div><label>Bulk Add</label><textarea id="bulkPlayers" placeholder="Paste one player per line"></textarea><div class="row"><button class="good" onclick="bulkAddPlayers()">Add List</button><button class="ghost" onclick="markAllPaid()">Mark All Paid</button><button class="ghost" onclick="checkAllIn()">Check All In</button></div><div class="seedTools"><button class="shuffleButton" onclick="shuffleSeeds()">Shuffle Players</button><button class="ghost" onclick="reseedByRoster()">Reset Seeds</button></div><div class="seedNotice">Shuffle before starting so pairings are not just roster order.</div></div><div class="card"><div class="cardHeader"><div><h2>Roster</h2><p>Mark paid and check players in.</p></div><span class="badge">${players.length}</span></div><input placeholder="Search players" value="${esc(S.filters.playerSearch)}" oninput="setFilter('playerSearch',this.value)"><div class="hr"></div>${players.map(renderPlayerRow).join("")||`<div class="notice">No players yet.< function renderPlayerRow(p){const tag=p.losses>=2?"danger":p.losses===1?"warn":"good";return `<div class="playerRow playerClickable" data-player-id="${p.id}"><span class="badge ${tag}">${p.losses||0}L</span><div><div class="nameLine">${esc(p.name)}</div><div class="subLine">${p.checkedIn?"Checked in":"Not checked"} · ${p.paid?"Paid":"Due"} · ${p.wins||0}W${p.phone?" · "+esc(p.phone):""}${p.rating?" · Rating "+esc(p.rating):""}${p.notes?" · Note: "+esc(p.notes):""}</div></div><div class="row directorOnly"><button class="${p.checkedIn?"good":"ghost"} small" onclick="togglePlayer(${p.id},'checkedIn')">${p.checkedIn?"Checked":"Check In"}</button><button class="${p.paid?"good":"warn"} small" onclick="togglePlayer(${p.id},'paid')">${p.paid?"Paid":"Due"}</button><button class="ghost small" onclick="notePlayer(${p.id})">Note</button><button class="danger small" onclick="removePlayer(${p.id})">Remove</button></div></div>`}
function renderBank(){const payouts=calcPayouts();return `<div class="grid2"><div class="card bankSensitive"><h2>Money / Payouts</h2><p class="subLine">No house take. No green fees. Pot equals buy-ins + side pot + added money.</p><div class="grid2">${moneyStepper("buyIn","Buy-In",S.bank.buyIn,5,10,0,10000)}${moneyStepper("sidePot","Side Pot / Player",S.bank.sidePot,5,10,0,10000)}${moneyStepper("added","Added Money",S.bank.added,10,50,0,100000)}${numberStepper("paidPlaces","Paid Places",S.bank.paidPlaces,1,2,1,8)}</div><div class="hr"></div><div class="grid3"><div class="control"><div class="controlTop"><b>Total Pot</b><span>${money(totalPot())}</span></div></div><div class="control"><div class="controlTop"><b>Collected</b><span>${money(activePlayers().filter(p=>p.paid).length*(Number(S.bank.buyIn||0)+Number(S.bank.sidePot||0)))}</span></div></div><div class="control"><div class="controlTop"><b>Still Due</b><span>${money(dueTotal())}</span></div></div></div></div><div class="card bankSensitive"><div class="cardHeader"><div><h2>Prize Payouts</h2><p>Set payout percentages.</p></div><span class="badge cyan">${money(totalPot())}</span></div>${payouts.map((p,i)=>renderPayoutRow(p,i)).join("")}<div class="hr"></div><div class="notice ${payoutPercentTotal()===100?"":"warn"}">Percent total: ${payoutPercentTotal()}%. Payout calculator normalizes active paid places to the total pot.</div></div></div>`}

function moneyStepper(key,label,value,small,big,min,max){return `<div class="control"><div class="controlTop"><b>${label}</b><span>${money(value)}</span></div><div class="stepper"><button class="ghost" onclick="addBank('${key}',-${big})">-${big}</button><button class="ghost" onclick="addBank('${key}',-${small})">-${small}</button><input type="number" min="${min}" max="${max}" value="${Number(value||0)}" onchange="setBank('${key}',this.value)"><button class="primary" onclick="addBank('${key}',${small})">+${small}</button><button class="hot" onclick="addBank('${key}',${big})">+${big}</button></div></div>`}

function renderBracket(){const groups={};S.matches.forEach(m=>{const key=`Round ${m.roundNo} · ${m.division}`;(groups[key] ||= []).push(m)});return `<div class="grid2"><div class="card"><div class="cardHeader"><div><h2>Standings</h2><p>Sorted by live tournament position.</p></div><button class="ghost small" onclick="copyStandings()">Copy</button></div>${standings().map((p,i)=>`<div class="playerRow playerClickable" data-player-id="${p.id}"><span class="badge ${p.losses>=2?"danger":p.losses===1?"warn":"good"}">#${i+1}</span><div><div class="nameLine">${esc(p.name)}</div><div class="subLine">${p.wins||0}W · ${p.losses||0}L · Byes ${p.byeCount||0}</div></div><span class="badge">${p.losses>=2?"Out":"Alive"}</span></div>`).join("")}</div><div class="card"><div class="cardHeader"><div><h2>Match Ledger</h2><p>All rounds, statuses, results, and disputes.</p></div><button class="primary small directorOnly" onclick="createNextRound(true)">Build Next</button></div>${Object.keys(groups).length?Object.keys(groups).map(k=>`<h3>${esc(k)}</h3>${groups[k].map(renderMatchRow).join("")}`).join(""):`<div class="notice">No matches yet.</div>`}</div></div>`}
function renderMatchRow(m){const winner=m.winner?`Winner: ${playerName(m.winner)}`:statusLabel(m.status);return `<div class="matchRow"><span class="badge ${statusBadgeClass(m.status)}">${esc(statusLabel(m.status))}</span><div><div class="nameLine">${esc(playerName(m.playerA))} vs ${esc(playerName(m.playerB))}</div><div class="subLine">${esc(m.label)} · Table ${m.table||"-"} · ${esc(winner)} ${m.notes?" · Note: "+esc(m.notes):""}</div></div><button class="ghost small directorOnly" onclick="openMatchModal(${m.id})">Open</button></div>`}
function renderSetup(){return `<div class="grid2"><div class="card directorOnly"><div class="card stopPanel"><h2>Stop / Reopen Setup</h2><button class="stopButton wide" onclick="stopTournamentKeepSetup()">STOP / REOPEN SETUP</button><p class="subLine">Use this if the tournament was started too early.</p></div><h2>Rules / Tables</h2><div class="grid2"><div><label>Tournament Name</label><input value="${esc(S.tournament.name)}" onchange="setTournament('name',this.value)"></div><div><label>Venue</label><input value="${esc(S.tournament.venue)}" onchange="setTournament('venue',this.value)"></div><div><label>Director</label><input value="${esc(S.tournament.director)}" onchange="setTournament('director',this.value)"></div><div><label>Date</label><input type="date" value="${esc(S.tournament.date)}" onchange="setTournament('date',this.value)"></div><div><label>Format</label><select onchange="setTournament('format',this.value)"><option value="double_elim" ${S.tournament.format==="double_elim"?"selected":""}>Double Elimination</option></select></div><div><label>Break Rule</label><input value="${esc(S.tournament.breakRule)}" onchange="setTournament('breakRule',this.value)"></div></div><div class="hr"></div><div class="grid2">${setupStepper("tables","Tables",S.tournament.tables,1,4,1,32)}${setupStepper("raceTo","Race To",S.tournament.raceTo,1,2,1,99)}${setupStepper("raceToFinal","Final Race To",S.tournament.raceToFinal,1,2,1,99)}</div><div class="hr"></div><div class="row"><button class="good" onclick="startTournament()">Start / Resume</button><button class="stopButton" onclick="stopTournamentKeepSetup()">Stop / Return to Setup</button><button class="warn" onclick="undo()">Undo</button><button class="danger" onclick="resetTournament()">New Tournament</button></div></div><div class="card"><h2>Save / Restore</h2><div class="notice">This is built for one laptop or one phone. No server, no login, no internet dependency after the file is opened.</div><div class="hr"></div><div class="row directorOnly"><button class="primary" onclick="exportBackup()">Download Backup</button><button class="ghost" onclick="document.getElementById('importFile').click()">Import Backup</button><button class="ghost" onclick="exportCSV()">Export CSV</button><button class="ghost" onclick="window.print()">Print</button></div><input id="importFile" class="hide" type="file" accept=".json,application/json" onchange="importBackup(this.files[0])"><div class="hr"></div><h3>App Check</h3>${integrityReport()}</div></div>`}
function setupStepper(key,label,value,small,big,min,max){return `<div>${stepper("tournament."+key,value,min,max,small,big,label)}</div>`}
function stepper(path,value,min,max,small,big,label){const displayLabel=label||path.split(".").pop();return `<div class="control"><div class="controlTop"><b>${esc(displayLabel)}</b><span>${Number(value||0)}</span></div><div class="stepper"><button class="ghost" onclick="addPath('${path}',-${big},${min},${max})">-${big}</button><button class="ghost" onclick="addPath('${path}',-${small},${min},${max})">-${small}</button><input type="number" min="${min}" max="${max}" value="${Number(value||0)}" onchange="setPath('${path}',this.value,${min},${max})"><button class="primary" onclick="addPath('${path}',${small},${min},${max})">+${small}</button><button class="hot" onclick="addPath('${path}',${big},${min},${max})">+${big}</button></div></div>`}
function integrityReport(){const checks=[[S.players.every((p,i,a)=>a.findIndex(x=>x.id===p.id)===i),"Player IDs unique"],[S.matches.every((m,i,a)=>a.findIndex(x=>x.id===m.id)===i),"Match IDs unique"],[openMatches().every(m=>playerById(m.playerA)&&playerById(m.playerB)),"Open matches have valid players"],[Number(S.tournament.tables)>=1,"At least one table"],[Number(S.tournament.raceTo)>=1,"Race length valid"]];return checks.map(([ok,text])=>`<div class="onDeckItem"><span class="badge ${ok?"good":"danger"}">${ok?"OK":"Fix"}</span><div>${esc(text)}</div><span></span></div>`).join("")}
function addPlayerFromForm(){addPlayer({name:$("pName").value,phone:$("pPhone").value,rating:$("pRating").value,seed:$("pSeed").value});["pName","pPhone","pRating","pSeed"].forEach(id=>$(id).value="")}
function quickAdd(){const el=$("quickName");addPlayer({name:el.value});el.value=""}
function addPlayer(data){const name=cleanName(data.name);if(!name)return alert("Enter a player name.");if(S.players.some(p=>!p.removed&&p.name.toLowerCase()===name.toLowerCase()))return alert("That player is already entered.");snapshot("Add player");S.players.push({id:S.nextPlayerId++,name,phone:cleanName(data.phone),rating:cleanName(data.rating),seed:data.seed?Number(data.seed):S.players.length+1,paid:false,checkedIn:true,removed:false,wins:0,losses:0,byeCount:0,scoreFor:0,scoreAgainst:0,notes:"",createdAt:NOW()});logEvent("player",`Added ${name}`);render()}
function bulkAddPlayers(){const text=$("bulkPlayers").value||"",names=text.split(/\n|,/).map(cleanName).filter(Boolean);if(!names.length)return;snapshot("Bulk add players");let added=0;names.forEach(name=>{if(!S.players.some(p=>!p.removed&&p.name.toLowerCase()===name.toLowerCase())){S.players.push({id:S.nextPlayerId++,name,phone:"",rating:"",seed:S.players.length+1,paid:false,checkedIn:true,removed:false,wins:0,losses:0,byeCount:0,scoreFor:0,scoreAgainst:0,notes:"",createdAt:NOW()});added++}});$("bulkPlayers").value="";logEvent("player",`Bulk added ${added} players`);render()}
function togglePlayer(id,field){const p=playerById(id);if(!p)return;snapshot("Toggle player");p[field]=!p[field];logEvent("player",`${p.name}: ${field} = ${p[field]}`);render()}function removePlayer(id){const p=playerById(id);if(!p)return;if(S.phase!=="setup"&&!confirm("Tournament already started. Remove this player anyway?"))return;snapshot("Remove player");p.removed=true;logEvent("player",`Removed ${p.name}`);render()}function notePlayer(id){const p=playerById(id);if(!p)return;const note=prompt("Player note",p.notes||"");if(note===null)return;snapshot("Player note");p.notes=note;render()}function markAllPaid(){snapshot("Mark all paid");activePlayers().forEach(p=>p.paid=true);logEvent("bank","Marked all active players paid");render()}function checkAllIn(){snapshot("Check all in");activePlayers().forEach(p=>p.checkedIn=true);logEvent("player","Checked all active players in");render()}function setFilter(key,val){S.filters[key]=val;render()}
function startTournament(){
  resetAutoChampionHandled();if(activePlayers().length<2)return alert("Need at least two players.");if(S.phase==="setup"){snapshot("Start tournament");S.phase="active";S.tournament.startedAt=S.tournament.startedAt||NOW();S.matches=[];S.rounds=[];S.eliminationOrder=[];S.nextMatchId=1;activePlayers().forEach((p,i)=>{p.wins=0;p.losses=0;p.byeCount=0;p.scoreFor=0;p.scoreAgainst=0;p.seed=p.seed||i+1});logEvent("tournament","Tournament started");createNextRound(false)}S.tab="home";render()}
function createNextRound(showAlert){if(S.phase==="complete"){if(showAlert)alert("Tournament is already complete.");return}if(S.phase==="setup"){if(showAlert)alert("Start the tournament first.");return}if(openMatches().length){if(showAlert)alert("Finish open matches before building the next round.");return}snapshot("Build round");const alive=alivePlayers();if(alive.length<=1){finishTournament();render();return}const nextRoundNo=(S.rounds.length?Math.max(...S.rounds.map(r=>r.roundNo)):0)+1,created=[];if(alive.length===2){created.push(...pairPlayers(alive,"Finals",nextRoundNo,finalLabel(alive),Number(S.tournament.raceToFinal||S.tournament.raceTo)))}else{created.push(...pairPlayers(alive.filter(p=>p.losses===0),"Winners",nextRoundNo,`Winners Round ${nextRoundNo}`,Number(S.tournament.raceTo)));created.push(...pairPlayers(alive.filter(p=>p.losses===1),"Losers",nextRoundNo,`Losers Round ${nextRoundNo}`,Number(S.tournament.raceTo)))}assignTables();S.rounds.push({roundNo:nextRoundNo,at:NOW(),count:created.length});if(created.length)logEvent("round",`Built round ${nextRoundNo}: ${created.length} match${created.length===1?"":"es"}`);else{logEvent("round",`Round ${nextRoundNo} contained byes only`);setTimeout(()=>createNextRound(false),0)}render()}
function finalLabel(alive){const losses=alive.map(p=>p.losses).sort().join("-");return losses==="0-1"?"Grand Final":"Final Reset"}
function pairPlayers(group,division,roundNo,label,raceTo){const sorted=group.slice().sort((a,b)=>(a.byeCount-b.byeCount)||(a.losses-b.losses)||((b.wins||0)-(a.wins||0))||((a.seed||9999)-(b.seed||9999))||a.name.localeCompare(b.name));if(sorted.length%2===1){const bye=sorted.shift();if(bye){bye.byeCount=(bye.byeCount||0)+1;logEvent("bye",`${bye.name} receives a bye`);S.matches.push({id:S.nextMatchId++,roundNo,division,label:`${division} Bye`,playerA:bye.id,playerB:null,winner:bye.id,loser:null,scoreA:0,scoreB:0,status:"bye",table:null,raceTo,createdAt:NOW(),startedAt:"",finishedAt:NOW(),notes:"Automatic bye"})}}const created=[];while(sorted.length>=2){const a=sorted.shift(),b=sorted.pop()||sorted.shift(),m={id:S.nextMatchId++,roundNo,division,label,playerA:a.id,playerB:b.id,winner:null,loser:null,scoreA:0,scoreB:0,status:"ready",table:null,raceTo,createdAt:NOW(),startedAt:"",finishedAt:"",notes:"",dispute:""};S.matches.push(m);created.push(m)}return created}
function assignTables(){const n=Math.max(1,Number(S.tournament.tables||1));openMatches().forEach((m,i)=>{m.table=(i%n)+1})}
function adjustScore(matchId,side,delta){const m=matchById(matchId);if(!m||m.status==="done")return;snapshot("Adjust score");if(side==="a")m.scoreA=Math.max(0,Number(m.scoreA||0)+Number(delta));if(side==="b")m.scoreB=Math.max(0,Number(m.scoreB||0)+Number(delta));if(Math.max(m.scoreA||0,m.scoreB||0)>=Number(m.raceTo||S.tournament.raceTo)-1&&Math.abs((m.scoreA||0)-(m.scoreB||0))===0)m.status="hill_hill";render()}
function recordWinner(matchId,winnerId){const m=matchById(matchId);if(!m||m.status==="done"||m.status==="bye")return;const winner=playerById(winnerId),loserId=Number(winnerId)===Number(m.playerA)?m.playerB:m.playerA,loser=playerById(loserId);if(!winner||!loser)return;if(!confirm(`${winner.name} wins this match?`))return;snapshot("Record winner");m.winner=winner.id;m.loser=loser.id;m.status="done";m.finishedAt=NOW();if(!m.startedAt)m.startedAt=NOW();winner.wins=(winner.wins||0)+1;loser.losses=(loser.losses||0)+1;winner.scoreFor=(winner.scoreFor||0)+(Number(m.playerA)===winner.id?Number(m.scoreA||0):Number(m.scoreB||0));winner.scoreAgainst=(winner.scoreAgainst||0)+(Number(m.playerA)===winner.id?Number(m.scoreB||0):Number(m.scoreA||0));loser.scoreFor=(loser.scoreFor||0)+(Number(m.playerA)===loser.id?Number(m.scoreA||0):Number(m.scoreB||0));loser.scoreAgainst=(loser.scoreAgainst||0)+(Number(m.playerA)===loser.id?Number(m.scoreB||0):Number(m.scoreA||0));if(loser.losses>=2&&!S.eliminationOrder.includes(loser.id))S.eliminationOrder.push(loser.id);logEvent("match",`${winner.name} defeated ${loser.name}`);assignTables();if(alivePlayers().length<=1)finishTournament();render()}
